name: Análisis de medios (bajo demanda)

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      request_id:
        description: "ID de media_analysis_requests (opcional; si vacío procesa la cola)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: media-analysis
  cancel-in-progress: false

jobs:
  analizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Verificar secretos
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          missing=0
          for v in GEMINI_API_KEY SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!v}" ]; then
              echo "::error::Falta el secret $v"
              missing=1
            fi
          done
          exit $missing

      - name: Procesar cola / solicitud
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TZ: America/Santiago
          PYTHONPATH: src
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          export SUPABASE_URL="${SUPABASE_URL:-https://ryznnccmqyvujrlhriml.supabase.co}"
          if [ -n "$REQUEST_ID" ]; then
            echo "Procesando solicitud $REQUEST_ID"
            python -m media_analyzer process-queue -v --output output/media_analysis --request-id "$REQUEST_ID"
          else
            # Procesa hasta 3 solicitudes pendientes por corrida
            for i in 1 2 3; do
              echo "Intento de cola #$i"
              python -m media_analyzer process-queue -v --output output/media_analysis || true
            done
          fi

      - name: Subir artefactos locales (privados de Actions)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media-analysis-output
          path: output/media_analysis/
          if-no-files-found: ignore
          retention-days: 14
